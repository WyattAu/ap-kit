[package]
name = "ap-kit"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
description = "Accounts payable: supplier bills, input VAT recoverability, and the three-way split between payable, deductible tax and expense"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/ap-kit"
keywords = ["accounting", "accounts-payable", "vat", "double-entry"]
categories = ["finance", "api-bindings"]
exclude = ["/target"]

[dependencies]
double-entry = "=0.1.1"
# The tax vocabulary is shared with accounts receivable, not re-derived.
vat-rules = "=0.1.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
